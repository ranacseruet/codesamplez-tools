<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Minifier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
          <h1>CSS Minifier</h1>
          <p>Optimize your CSS files by removing unnecessary characters without changing functionality.</p>
        </header>
        
        <div class="minifier">
          <div class="editor-container">
            <div class="editor-box">
              <div class="editor-header">
                <div class="editor-title">Input CSS</div>
                <div class="editor-actions">
                  <button id="clear-input">Clear</button>
                  <button id="load-sample">Load Sample</button>
                </div>
              </div>
              <textarea id="input-css" placeholder="Paste your CSS code here..."></textarea>
            </div>
            
            <div class="editor-box">
              <div class="editor-header">
                <div class="editor-title">Minified Output</div>
                <div class="editor-actions">
                  <button id="copy-output">Copy</button>
                </div>
              </div>
              <textarea id="output-css" readonly placeholder="Minified CSS will appear here..."></textarea>
            </div>
          </div>
          
          <div class="controls">
            <div class="options">
              <div class="option-item">
                <input type="checkbox" id="remove-comments" checked>
                <label for="remove-comments">Remove comments</label>
              </div>
              <div class="option-item">
                <input type="checkbox" id="remove-whitespace" checked>
                <label for="remove-whitespace">Remove whitespace</label>
              </div>
              <div class="option-item">
                <input type="checkbox" id="combine-selectors" checked>
                <label for="combine-selectors">Combine duplicate selectors</label>
              </div>
              <div class="option-item">
                <input type="checkbox" id="shorten-colors" checked>
                <label for="shorten-colors">Shorten color values</label>
              </div>
              <div class="option-item">
                <input type="checkbox" id="remove-units" checked>
                <label for="remove-units">Remove unnecessary units</label>
              </div>
              <div class="option-item">
                <input type="checkbox" id="remove-last-semicolons" checked>
                <label for="remove-last-semicolons">Remove last semicolons</label>
              </div>
            </div>
            
            <div class="button-group">
              <button id="minify-btn" class="primary">Minify CSS</button>
              <button id="reset-options" class="secondary">Reset Options</button>
            </div>
            
            <div class="stats">
              <div class="stat-item">
                <span class="stat-label">Original Size</span>
                <span id="original-size" class="stat-value">0 bytes</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Minified Size</span>
                <span id="minified-size" class="stat-value">0 bytes</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Savings</span>
                <span id="saving" class="stat-value saving-percentage">0%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div id="notification" class="notification">Copied to clipboard!</div>
      <script src="minifier.js"></script>
      <script src="script.js"></script>
</body>
</html>
