<!DOCTYPE html>
<html>
<head>
<title>JWT Builder</title>
<link rel="stylesheet" href="styles.main.css">
</head>
<body>
  <div class="tool-container jwt-builder-container">
    <div class="o-header jwt-builder-header">
      <h1>JWT Builder</h1>
      <p class="o-description jwt-builder-description">
        Create and sign JSON Web Tokens with standard and custom claims
      </p>
    </div>
    <!-- Removed claims-grid and claims-column, using flex utilities on form -->
    <form id="jwtForm" class="u-flex u-flex-column u-gap-lg">
      <!-- Standard Claims Grid -->
      <div class="o-grid-2col">
        <!-- Identity Claims -->
        <div class="c-form-group">
          <h3 class="c-form-group-header">Identity Claims</h3>
          <div class="c-form-row">
          <label for="iss" class="required">
            <span class="c-tooltip-container" title="Who issued the token">
              Issuer (iss):
              <span class="c-tooltip">Required - Identifies the principal that issued the JWT</span>
            </span>
          </label>
          <input type="text" id="iss" class="c-input" placeholder="e.g., my-app">
        </div>
        <div class="c-form-row">
          <label for="sub">
            <span class="c-tooltip-container" title="Who the token refers to">
              Subject (sub):
              <span class="c-tooltip">Optional - Identifies the principal that is the subject of the JWT</span>
            </span>
          </label>
          <input type="text" id="sub" class="c-input" placeholder="e.g., user123">
        </div>
        <div class="c-form-row">
          <label for="aud">
            <span class="c-tooltip-container" title="Who the token is intended for">
              Audience (aud):
              <span class="c-tooltip">Optional - Identifies the recipients that the JWT is intended for</span>
            </span>
          </label>
          <input type="text" id="aud" class="c-input" placeholder="e.g., my-api">
          </div>
        </div>

        <!-- Timing Claims -->
        <div class="c-form-group">
          <h3 class="c-form-group-header">Timing Claims</h3>
          <div class="c-form-row">
          <label for="exp" class="required">
            <span class="c-tooltip-container" title="When the token expires">
              Expiration Time (exp):
              <span class="c-tooltip">Required - Identifies the expiration time on or after which the JWT must not be accepted</span>
            </span>
          </label>
          <input type="text" id="exp" class="c-input" placeholder="e.g., 2025-12-31T23:59:59Z or 1678886400">
        </div>
        <div class="c-form-row">
          <label for="iat">
            <span class="c-tooltip-container" title="When the token was issued">
              Issued At (iat):
              <span class="c-tooltip">Optional - Identifies the time at which the JWT was issued</span>
            </span>
          </label>
          <input type="text" id="iat" class="c-input" placeholder="e.g., 2025-01-30T11:24:00Z or 1678886400">
        </div>
        <div class="c-form-row">
          <label for="nbf">
            <span class="c-tooltip-container" title="When the token starts being valid">
              Not Before (nbf):
              <span class="c-tooltip">Optional - Identifies the time before which the JWT must not be accepted</span>
            </span>
          </label>
          <input type="text" id="nbf" class="c-input" placeholder="e.g., 2025-01-30T00:00:00Z or 1678886400">
          </div>
        </div>

        <!-- Metadata Claims -->
        <div class="c-form-group">
          <h3 class="c-form-group-header">Metadata Claims</h3>
          <div class="c-form-row">
          <label for="jti">
            <span class="c-tooltip-container" title="Unique identifier for this token">
              JWT ID (jti):
              <span class="c-tooltip">Optional - Provides a unique identifier for the JWT</span>
            </span>
          </label>
          <input type="text" id="jti" class="c-input" placeholder="e.g., unique-id">
          </div>
        </div>

        <!-- Signature -->
        <div class="c-form-group">
          <h3 class="c-form-group-header">Signature</h3>
          <div class="c-form-row">
          <label for="key" class="required">
            <span class="c-tooltip-container" title="Secret key for signing the JWT">
              Signature Key:
              <span class="c-tooltip">Required - The secret key used to sign the JWT. Keep this secure and never share it.</span>
            </span>
          </label>
          <input type="text" id="key" class="c-input" value="jwt-secret" placeholder="Your secret key">
        </div>
        </div>
      </div> <!-- End of o-grid-2col -->

      <!-- Custom Claims -->
      <div class="c-form-group">
        <h3 class="c-form-group-header">
          <span>Custom Claims</span> <!-- Wrap text in span for flex alignment -->
          <button type="button" class="c-button c-button--secondary c-button--small add-claim" onclick="addClaim()" title="Add a custom claim">
            + Add Claim
          </button>
        </h3>
        <div id="customClaims" class="u-flex u-flex-column u-gap-md"> <!-- Add flex utilities -->
          <div class="empty-claims-message">No custom claims added yet</div>
        </div>
      </div>

      <button type="button" id="buildJwtBtn" class="c-button" onclick="buildJWT()">Build JWT</button>
    </form>

    <!-- Result Section -->
    <div class="c-form-group result-section">
      <h3 class="c-form-group-header">Generated JWT</h3>
      <div class="u-flex u-gap-sm result-container"> <!-- Use flex utilities -->
        <pre id="result" class="c-code-output" title="Generated JWT token"></pre> <!-- Use pre for code output -->
        <button type="button" id="copyJwtBtn" class="c-button c-button--secondary copy-button" onclick="copyJWT()" title="Copy token to clipboard">
          Copy JWT
        </button>
      </div>
    </div>
  </div>
  <script src="bundle.main.js"></script>
</body>
</html>
