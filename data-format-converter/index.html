<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Format Converter</title>
    <link rel="stylesheet" href="styles.main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Data Format Converter</h1>
            <p>Convert between JSON, XML, and YAML formats seamlessly</p>
        </div>

        <div class="converter-section">
            <div class="input-section">
                <h2 class="section-title">Input Format</h2>
                <div class="format-selector">
                    <button class="format-btn active" data-format="json">JSON</button>
                    <button class="format-btn" data-format="xml">XML</button>
                    <button class="format-btn" data-format="yaml">YAML</button>
                </div>
                <textarea 
                    id="inputText" 
                    class="text-area" 
                    placeholder="Paste your data here..."
                ></textarea>
                <div id="inputError" class="error" style="display: none;"></div>
            </div>

            <div class="arrow-container">
                <div class="arrow">⬇</div>
            </div>

            <div class="output-section">
                <h2 class="section-title">Output Format</h2>
                <div class="format-selector">
                    <button class="format-btn" data-format="json">JSON</button>
                    <button class="format-btn active" data-format="xml">XML</button>
                    <button class="format-btn" data-format="yaml">YAML</button>
                </div>
                <textarea 
                    id="outputText" 
                    class="text-area" 
                    placeholder="Converted data will appear here..."
                    readonly
                ></textarea>
                <div id="outputSuccess" class="success" style="display: none;"></div>
            </div>

            <button id="convertBtn" class="convert-btn">Convert Data</button>
        </div>
    </div>
    <script src="bundle.main.js"></script>
</body>
</html>
