<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Format Converter</title>
    <link rel="stylesheet" href="styles.main.css">
</head>
<body>
    <div class="tool-container">
        <div class="o-header">
            <h1>Data Format Converter</h1>
            <p>Convert between JSON, XML, and YAML formats seamlessly</p>
        </div>

        <div class="converter-section o-grid-2col">
            <div class="input-section o-panel">
                <h2>Input Format</h2>
                <div class="format-selector">
                    <button class="format-btn active c-button c-button--small" data-format="json">JSON</button>
                    <button class="format-btn c-button c-button--small" data-format="xml">XML</button>
                    <button class="format-btn c-button c-button--small" data-format="yaml">YAML</button>
                </div>
                <textarea 
                    id="inputText" 
                    class="text-area c-input c-input--textarea" 
                    placeholder="Paste your data here..."
                ></textarea>
            </div>
            <div class="output-section o-panel">
                <h2>Output Format</h2>
                <div class="format-selector">
                    <button class="format-btn c-button c-button--small" data-format="json">JSON</button>
                    <button class="format-btn active c-button c-button--small" data-format="xml">XML</button>
                    <button class="format-btn c-button c-button--small" data-format="yaml">YAML</button>
                </div>
                <textarea 
                    id="outputText" 
                    class="text-area c-input c-input--textarea" 
                    placeholder="Converted data will appear here..."
                    readonly
                ></textarea>
                <div class="output-actions" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button id="copyBtn" class="c-button c-button--small">Copy</button>
                    <button id="downloadBtn" class="c-button c-button--small">Download</button>
                </div>
            </div>

        </div>
        <div class="u-text-center">
            <button id="convertBtn" class="convert-btn c-button">Convert Data</button>
        </div>
        <div id="inputError" class="error" style="display: none;"></div>
        <div id="notification" class="c-notification"></div>
    </div>
    <script type="module" src="bundle.main.js"></script>
</body>
</html>
