<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="diff-checker-container">
    <h1>Diff Checker Tool</h1>
    <div class="text-area-container">
      <textarea id="text1" placeholder="Paste your first text here..."></textarea>
      <textarea id="text2" placeholder="Paste your second text here..."></textarea>
    </div>
    <button id="compare-button">Compare</button>
    <div id="diff-result-container">
      <h2>Differences</h2>
      <pre id="diff-result"></pre>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
