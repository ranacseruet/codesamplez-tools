<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="diff-container">
    <h1 class="heading">Diff Checker Tool</h1>
    <div class="input-container">
      <textarea class="input-field" id="diff-text1" placeholder=" "></textarea>
      <label class="input-label" for="diff-text1">First Text</label>
    </div>
    <div class="input-container">
      <textarea class="input-field" id="diff-text2" placeholder=" "></textarea>
      <label class="input-label" for="diff-text2">Second Text</label>
    </div>
    <div class="button-group">
      <button class="btn" id="diff-button">Compare Texts</button>
      <button class="btn btn-secondary" id="clear-button">Clear</button>
    </div>
    <div class="diff-results-container">
      <div class="diff-column">
        <h3>Original Text</h3>
        <div id="diff-original" class="output"></div>
      </div>
      <div class="diff-column">
        <h3>Modified Text</h3>
        <div id="diff-modified" class="output"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="browser.js"></script>
</body>
</html>
