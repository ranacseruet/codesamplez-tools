<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker Tool</title>
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --success-bg: #dcfce7;
      --error-bg: #fee2e2;
      --container-width: 900px;
      --transition-speed: 0.2s;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-color);
      margin: 0;
      padding: 2rem;
      color: var(--text-color);
      line-height: 1.5;
      min-height: 100vh;
    }

    .diff-container {
      max-width: var(--container-width);
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                  0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .diff-container .heading {
      text-align: center;
      color: var(--text-color);
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 700;
    }

    .diff-container .input-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .diff-container .input-field {
      width: 100%;
      height: 180px;
      padding: 1.5rem 1rem 0.5rem;
      border: 2px solid var(--border-color);
      border-radius: 0.5rem;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.875rem;
      resize: vertical;
      transition: all var(--transition-speed) ease;
      box-sizing: border-box;
      background: transparent;
    }

    .diff-container .input-label {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: #9ca3af;
      pointer-events: none;
      transition: all var(--transition-speed) ease;
      font-size: 0.875rem;
    }

    .diff-container .input-field:focus ~ .input-label,
    .diff-container .input-field:not(:placeholder-shown) ~ .input-label {
      top: 0.5rem;
      left: 0.75rem;
      font-size: 0.75rem;
      color: var(--primary-color);
    }

    .diff-container .input-field:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .diff-container .input-field::placeholder {
      color: #9ca3af;
    }

    .diff-container .button-group {
      display: flex;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .diff-container .btn {
      flex: 1;
      padding: 0.875rem;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-speed) ease;
      position: relative;
      overflow: hidden;
    }

    .diff-container .btn-secondary {
      background-color: #fff;
      color: var(--text-color);
      border: 2px solid var(--border-color);
    }

    .diff-container .btn-secondary:hover {
      background-color: var(--bg-color);
    }

    .diff-container .btn-loading {
      pointer-events: none;
    }

    .diff-container .btn-loading::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .diff-container .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .diff-container .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .diff-container .output {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background-color: #fff;
      border: 2px solid var(--border-color);
      border-radius: 0.5rem;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-x: auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .diff-container .output:empty {
      display: none;
    }

    .diff-container .output ins {
      background-color: var(--success-bg);
      text-decoration: none;
      padding: 0.125rem 0;
      border-radius: 0.25rem;
    }

    .diff-container .output del {
      background-color: var(--error-bg);
      text-decoration: none;
      padding: 0.125rem 0;
      border-radius: 0.25rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      .diff-container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="diff-container">
    <h1 class="heading">Diff Checker Tool</h1>
    <div class="input-container">
      <textarea class="input-field" id="diff-text1" placeholder=" "></textarea>
      <label class="input-label" for="diff-text1">First Text</label>
    </div>
    <div class="input-container">
      <textarea class="input-field" id="diff-text2" placeholder=" "></textarea>
      <label class="input-label" for="diff-text2">Second Text</label>
    </div>
    <div class="button-group">
      <button class="btn" id="diff-button">Compare Texts</button>
      <button class="btn btn-secondary" id="clear-button">Clear</button>
    </div>
    <div id="diff-result" class="output"></div>
  </div>

  <script>
    const diffButton = document.getElementById('diff-button');
    const clearButton = document.getElementById('clear-button');
    const text1Input = document.getElementById('diff-text1');
    const text2Input = document.getElementById('diff-text2');
    const diffResult = document.getElementById('diff-result');

    diffButton.addEventListener('click', async function () {
      diffButton.classList.add('loading');
      diffButton.textContent = '';
      
      // Simulate processing delay
      await new Promise(resolve => setTimeout(resolve, 300));
      
      const text1 = text1Input.value;
      const text2 = text2Input.value;
      diffResult.innerHTML = diff(text1, text2);
      
      diffButton.classList.remove('loading');
      diffButton.textContent = 'Compare Texts';
    });

    clearButton.addEventListener('click', function() {
      text1Input.value = '';
      text2Input.value = '';
      diffResult.innerHTML = '';
      text1Input.dispatchEvent(new Event('input'));
      text2Input.dispatchEvent(new Event('input'));
    });

    // Update floating labels on input
    [text1Input, text2Input].forEach(input => {
      input.addEventListener('input', () => {
        const label = input.nextElementSibling;
        if (input.value) {
          label.classList.add('active');
        } else {
          label.classList.remove('active');
        }
      });
    });

    function diff(text1, text2) {
      const lines1 = text1.split('\n');
      const lines2 = text2.split('\n');
      let result = '';
      let i = 0, j = 0;

      while (i < lines1.length || j < lines2.length) {
        if (i < lines1.length && j < lines2.length && lines1[i] === lines2[j]) {
          result += lines1[i] + '\n';
          i++;
          j++;
        } else {
          if (j < lines2.length && (i >= lines1.length || lines1.indexOf(lines2[j], i) === -1)) {
            result += `<ins>${lines2[j]}</ins>\n`;
            j++;
          } else if (i < lines1.length && (j >= lines2.length || lines2.indexOf(lines1[i], j) === -1)) {
            result += `<del>${lines1[i]}</del>\n`;
            i++;
          } else {
            result += `<del>${lines1[i]}</del>\n`;
            result += `<ins>${lines2[j]}</ins>\n`;
            i++;
            j++;
          }
        }
      }

      return result;
    }
  </script>
</body>
</html>
