<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker Tool</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --success-bg: #dcfce7;
      --error-bg: #fee2e2;
      --container-width: 900px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 2rem;
      color: var(--text-color);
      line-height: 1.5;
    }

    .diff-container {
      max-width: var(--container-width);
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                  0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      text-align: center;
      color: var(--text-color);
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 0.5rem;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      resize: vertical;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea::placeholder {
      color: #9ca3af;
    }

    button {
      display: block;
      width: 100%;
      padding: 0.875rem;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 1.5rem 0;
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .diff-output {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background-color: #fff;
      border: 2px solid var(--border-color);
      border-radius: 0.5rem;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .diff-output:empty {
      display: none;
    }

    .diff-output ins {
      background-color: var(--success-bg);
      text-decoration: none;
      padding: 0.125rem 0;
      border-radius: 0.25rem;
    }

    .diff-output del {
      background-color: var(--error-bg);
      text-decoration: none;
      padding: 0.125rem 0;
      border-radius: 0.25rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      .diff-container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="diff-container">
    <h1>Diff Checker Tool</h1>
    <textarea id="diff-text1" placeholder="Paste or type the first text here..."></textarea>
    <textarea id="diff-text2" placeholder="Paste or type the second text here..."></textarea>
    <button id="diff-button">Compare Texts</button>
    <div id="diff-result" class="diff-output"></div>
  </div>

  <script>
    document.getElementById('diff-button').addEventListener('click', function () {
      const text1 = document.getElementById('diff-text1').value;
      const text2 = document.getElementById('diff-text2').value;
      const diffResult = document.getElementById('diff-result');
      diffResult.innerHTML = diff(text1, text2);
    });

    function diff(text1, text2) {
      const lines1 = text1.split('\n');
      const lines2 = text2.split('\n');
      let result = '';
      let i = 0, j = 0;

      while (i < lines1.length || j < lines2.length) {
        if (i < lines1.length && j < lines2.length && lines1[i] === lines2[j]) {
          result += lines1[i] + '\n';
          i++;
          j++;
        } else {
          if (j < lines2.length && (i >= lines1.length || lines1.indexOf(lines2[j], i) === -1)) {
            result += `<ins>${lines2[j]}</ins>\n`;
            j++;
          } else if (i < lines1.length && (j >= lines2.length || lines2.indexOf(lines1[i], j) === -1)) {
            result += `<del>${lines1[i]}</del>\n`;
            i++;
          } else {
            result += `<del>${lines1[i]}</del>\n`;
            result += `<ins>${lines2[j]}</ins>\n`;
            i++;
            j++;
          }
        }
      }

      return result;
    }
  </script>
</body>
</html>
