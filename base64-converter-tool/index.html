<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Base64 Converter</title>
    <link rel="stylesheet" href="styles.main.css">
</head>
<body>
    <div class="base64converter-container">
        <div class="base64converter-header">
            <h1 class="base64converter-title">Base64 Converter</h1>
            <p class="base64converter-description">Convert text and files to and from Base64 encoding with support for multiple character encodings.</p>
        </div>
        
        <div class="base64converter-controls">
            <div class="base64converter-control-group">
                <select id="base64converter-mode" class="base64converter-select">
                    <option value="auto">Auto Detect</option>
                    <option value="encode">Encode</option>
                    <option value="decode">Decode</option>
                </select>

                <select id="base64converter-encoding" class="base64converter-select base64converter-encoding-select">
                    <option value="utf8">UTF-8</option>
                    <option value="ascii">ASCII</option>
                    <option value="iso88591">ISO-8859-1</option>
                    <option value="ucs2">UCS-2</option>
                </select>
            </div>

            <div class="base64converter-control-group">
                <label class="base64converter-file-label" for="base64converter-file">
                    Upload File
                </label>
                <input type="file" id="base64converter-file" class="base64converter-file-input">
            </div>
        </div>

        <div class="base64converter-editor-container">
            <div class="base64converter-panel">
                <div class="base64converter-panel-header">
                    <h2>Input</h2>
                    <div class="base64converter-toolbar">
                        <button id="base64converter-convert" class="base64converter-button">Convert</button>
                        <button id="base64converter-clear" class="base64converter-button base64converter-secondary">Clear</button>
                    </div>
                </div>
                <textarea id="base64converter-input" class="base64converter-textarea" 
                    placeholder="Enter text to encode or decode..."></textarea>
            </div>
            
            <div class="base64converter-panel">
                <div class="base64converter-panel-header">
                    <h2>Output</h2>
                    <div class="base64converter-toolbar">
                        <button id="base64converter-copy" class="base64converter-button">
                            Copy Result
                        </button>
                    </div>
                </div>
                <div id="base64converter-result" class="base64converter-result"></div>
            </div>
        </div>
        
        <div class="base64converter-status">
            <span id="base64converter-status"></span>
            <span id="base64converter-copy-status"></span>
        </div>
    </div>

    <div id="notification" class="base64converter-notification">Copied to clipboard!</div>
    <script src="bundle.main.js"></script>
</body>
</html>
