<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Base64 Converter</title>
    <link rel="stylesheet" href="styles.main.css">
</head>
<body>
    <div class="tool-container">
        <div class="o-header">
            <h1>Base64 Converter</h1>
            <p class="o-description">Convert text and files to and from Base64 encoding with support for multiple character encodings.</p>
        </div>
        
        <div class="o-controls">
            <div class="u-flex u-gap-sm">
                <select id="base64converter-mode" class="tool-container select">
                    <option value="auto">Auto Detect</option>
                    <option value="encode">Encode</option>
                    <option value="decode">Decode</option>
                </select>

                <select id="base64converter-encoding" class="tool-container select">
                    <option value="utf8">UTF-8</option>
                    <option value="ascii">ASCII</option>
                    <option value="iso88591">ISO-8859-1</option>
                    <option value="ucs2">UCS-2</option>
                </select>
            </div>

            <div class="u-flex u-gap-sm">
                <label class="c-button" for="base64converter-file">
                    Upload File
                </label>
                <input type="file" id="base64converter-file" style="display: none;">
            </div>
        </div>

        <div class="u-flex u-gap-lg">
            <div class="o-panel">
                <div class="o-panel-header">
                    <h2>Input</h2>
                    <div class="o-toolbar">
                        <button id="base64converter-convert" class="c-button">Convert</button>
                        <button id="base64converter-clear" class="c-button c-button--secondary">Clear</button>
                    </div>
                </div>
                <textarea id="base64converter-input" 
                    placeholder="Enter text to encode or decode..."></textarea>
            </div>
            
            <div class="o-panel">
                <div class="o-panel-header">
                    <h2>Output</h2>
                    <div class="o-toolbar">
                        <button id="base64converter-copy" class="c-button">
                            Copy Result
                        </button>
                    </div>
                </div>
                <div id="base64converter-result" class="tool-container textarea"></div>
            </div>
        </div>
        
        <div class="o-controls">
            <span id="base64converter-status"></span>
            <span id="base64converter-copy-status"></span>
        </div>
    </div>

    <div id="notification" class="c-notification">Copied to clipboard!</div>
    <script src="bundle.main.js"></script>
</body>
</html>
