<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <style>
    /* Add your CSS styling here */
    #text-analyzer-container {
        width: 600px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        font-family: sans-serif;
    }

    #text-input {
        width: calc(100% - 22px);
        height: 200px;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 3px;
        resize: vertical;
        font-size: 16px;
    }

    .results {
        margin-bottom: 10px;
        font-size: 18px;
    }

    #text-analyzer-container h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }
    </style>
</head>
<body>
    <div id="text-analyzer-container">
        <h1>Text Analyzer</h1>
        <textarea id="text-input" placeholder="Enter your text here..."></textarea>
        <div class="results">Characters: <span id="char-count">0</span></div>
        <div class="results">Words: <span id="word-count">0</span></div>
        <div class="results">Sentences: <span id="sentence-count">0</span></div>
    </div>
    <script>
        // Add your JavaScript code here
        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const wordCount = document.getElementById('word-count');
        const sentenceCount = document.getElementById('sentence-count');

        textInput.addEventListener('input', () => {
            const text = textInput.value;

            // Character count
            charCount.textContent = text.length;

            // Word count (approximate)
            const words = text.trim().split(/\s+/);
            wordCount.textContent = words.length === 1 && words[0] === "" ? 0 : words.length;

            // Sentence count (approximate)
            const sentences = text.trim().split(/[.!?]+/);
            sentenceCount.textContent = sentences.length === 1 && sentences[0] === "" ? 0 : sentences.length;
        });
    </script>
</body>
</html>
