name: Publish Visual PR Comment
description: Upsert a PR comment with the visual diff summary.

inputs:
  github-token:
    description: Token used to update the pull request comment.
    required: true
  pr-number:
    description: Pull request number to comment on.
    required: false
    default: ''
  summary-path:
    description: Path to the visual diff summary JSON.
    required: true
  run-url:
    description: Workflow run URL to include in the comment.
    required: false
    default: ''
  artifact-name:
    description: Artifact label to include in the comment.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        VISUAL_DIFF_SUMMARY_PATH: ${{ inputs.summary-path }}
        VISUAL_DIFF_RUN_URL: ${{ inputs.run-url }}
        VISUAL_DIFF_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- pr-visual-diff-summary -->';
          const summaryPath = process.env.VISUAL_DIFF_SUMMARY_PATH;
          if (!fs.existsSync(summaryPath)) {
            core.warning(`Visual diff summary not found at ${summaryPath}`);
            return;
          }

          const issueNumber = Number('${{ inputs.pr-number }}' || context.payload.pull_request?.number || context.issue?.number || '');
          if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
            core.warning('Visual diff PR comment skipped because no pull request number was available.');
            return;
          }

          const runUrl = process.env.VISUAL_DIFF_RUN_URL || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const status = summary.status || 'incomplete';
          const statusLabelMap = {
            clean: 'Clean',
            'changes-detected': 'Changes detected',
            incomplete: 'Incomplete',
            skipped: 'Skipped'
          };
          const statusIconMap = {
            clean: '✅',
            'changes-detected': '🟡',
            incomplete: '⚠️',
            skipped: '⏭️'
          };

          const selectedRoutes = Array.isArray(summary.selectedRoutes)
            ? String(summary.selectedRoutes.length)
            : 'all';
          const dimensionChanges = summary.dimensionChanges || [];
          const lines = [
            marker,
            '## Visual Diff',
            '',
            `- Status: ${statusIconMap[status] || '⚠️'} **${statusLabelMap[status] || status}**`,
            `- Selected routes: ${selectedRoutes}`,
            `- Changed screenshots: ${summary.changedScreenshots || 0}`,
            `- Matched screenshots: ${summary.matchedScreenshots || 0}`,
            `- Missing in baseline: ${summary.missingInBaseline || 0}`,
            `- Missing in current: ${summary.missingInCurrent || 0}`,
            `- Viewport dimension changes: ${dimensionChanges.length}`,
            `- Comparison errors: ${(summary.errors || []).length}`
          ];

          if (process.env.VISUAL_DIFF_ARTIFACT_NAME) {
            lines.push(`- Artifact: \`${process.env.VISUAL_DIFF_ARTIFACT_NAME}\``);
          }
          if (runUrl) {
            lines.push(`- Run: ${runUrl}`);
          }
          if (summary.baselineArtifactName) {
            lines.push(`- Baseline artifact: \`${summary.baselineArtifactName}\``);
          }
          if (summary.baselineSourceSha) {
            lines.push(`- Baseline SHA: \`${summary.baselineSourceSha}\``);
          }
          if (summary.message) {
            lines.push(`- Details: ${summary.message}`);
          }
          if (Array.isArray(summary.changed) && summary.changed.length > 0) {
            lines.push('');
            lines.push('<details><summary>Changed screenshots</summary>');
            lines.push('');
            for (const item of summary.changed.slice(0, 10)) {
              const percentChanged = typeof item.mismatchRatio === 'number'
                ? `${(item.mismatchRatio * 100).toFixed(2)}%`
                : 'n/a';
              lines.push(`- ${item.id} (${item.viewport}) - ${percentChanged} changed`);
            }
            if (summary.changed.length > 10) {
              lines.push(`- ...and ${summary.changed.length - 10} more`);
            }
            lines.push('');
            lines.push('</details>');
          }

          if (dimensionChanges.length > 0) {
            lines.push('');
            lines.push('<details><summary>Viewport dimension changes — diff skipped</summary>');
            lines.push('');
            lines.push('The page dimensions changed between the baseline and the current capture. Pixel diff was skipped for these routes.');
            lines.push('**Next step:** merge this PR and let the main CI re-capture the baseline with the new dimensions.');
            lines.push('');
            for (const item of dimensionChanges) {
              lines.push(`- **${item.id}** (${item.viewport}): baseline ${item.baselineWidth}×${item.baselineHeight} → current ${item.currentWidth}×${item.currentHeight}`);
            }
            lines.push('');
            lines.push('</details>');
          }

          const body = lines.join('\n');
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            per_page: 100
          });
          const matchingComments = comments
            .filter((comment) => comment.body && comment.body.includes(marker))
            .sort((left, right) => {
              const leftTime = new Date(left.updated_at || left.created_at).getTime();
              const rightTime = new Date(right.updated_at || right.created_at).getTime();
              return rightTime - leftTime;
            });
          const existing = matchingComments[0];

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
          }

          for (const duplicate of matchingComments.slice(1)) {
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: duplicate.id
            });
          }
