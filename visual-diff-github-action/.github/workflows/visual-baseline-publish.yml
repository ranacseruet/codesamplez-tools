name: Visual Baseline Publish Template

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '23'
      repo-config-path:
        required: false
        type: string
        default: .github/visual-regression.json
      artifact-retention-days:
        required: false
        type: number
        default: 30
      install-command:
        required: false
        type: string
        default: npm ci
      build-command:
        required: false
        type: string
        default: npm run build
      start-command:
        required: true
        type: string

jobs:
  publish-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build app
        run: ${{ inputs.build-command }}

      - name: Start app
        run: |
          set -euo pipefail
          ${{ inputs.start-command }} > /tmp/visual-baseline-start.log 2>&1 &
          echo "QA_SERVER_PID=$!" >> "$GITHUB_ENV"
          trap 'kill "$QA_SERVER_PID" || true' EXIT
          for i in $(seq 1 45); do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/visual-baseline-start.log || true
          exit 1

      - name: Capture visual routes
        id: capture
        uses: ./visual-diff-github-action/actions/capture-visual-routes
        with:
          repo-config-path: ${{ inputs.repo-config-path }}

      - name: Stage baseline artifact
        id: stage
        uses: ./visual-diff-github-action/actions/stage-visual-artifacts
        with:
          artifact-type: baseline
          bundle-dir: qa-artifacts/visual-baseline-artifact
          results-path: ${{ steps.capture.outputs.results-file }}
          manifest-path: ${{ steps.capture.outputs.manifest-file }}
          screenshots-dir: ${{ steps.capture.outputs.screenshots-root }}/screenshots

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-foundation-visual-baseline
          retention-days: ${{ inputs.artifact-retention-days }}
          path: ${{ steps.stage.outputs.bundle-dir }}
