name: Visual PR Diff Template

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '23'
      repo-config-path:
        required: false
        type: string
        default: .github/visual-regression.json
      artifact-retention-days:
        required: false
        type: number
        default: 30
      comment-on-pr:
        required: false
        type: boolean
        default: false
      install-command:
        required: false
        type: string
        default: npm ci
      build-command:
        required: false
        type: string
        default: npm run build
      start-command:
        required: true
        type: string
      pr-number:
        required: false
        type: string
        default: ''

jobs:
  visual-pr-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Resolve baseline artifact
        id: baseline
        uses: ./visual-diff-github-action/actions/resolve-baseline-artifact
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-config-path: ${{ inputs.repo-config-path }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build app
        run: ${{ inputs.build-command }}

      - name: Start app
        run: |
          set -euo pipefail
          ${{ inputs.start-command }} > /tmp/visual-pr-diff-start.log 2>&1 &
          echo "QA_SERVER_PID=$!" >> "$GITHUB_ENV"
          trap 'kill "$QA_SERVER_PID" || true' EXIT
          for i in $(seq 1 45); do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/visual-pr-diff-start.log || true
          exit 1

      - name: Capture current visual routes
        id: capture
        uses: ./visual-diff-github-action/actions/capture-visual-routes
        with:
          repo-config-path: ${{ inputs.repo-config-path }}

      - name: Compare with baseline
        id: compare
        uses: ./visual-diff-github-action/actions/compare-visual-results
        with:
          repo-config-path: ${{ inputs.repo-config-path }}
          baseline-results-path: ${{ steps.baseline.outputs.results-file }}
          baseline-manifest-path: ${{ steps.baseline.outputs.manifest-file }}
          baseline-run-dir: ${{ steps.baseline.outputs.run-dir }}
          current-results-path: ${{ steps.capture.outputs.results-file }}
          current-manifest-path: ${{ steps.capture.outputs.manifest-file }}
          current-run-dir: ${{ steps.capture.outputs.screenshots-root }}
          baseline-artifact-name: ${{ steps.baseline.outputs.artifact-name }}
          baseline-source-sha: ${{ steps.baseline.outputs.head-sha }}

      - name: Stage diff artifact
        id: stage
        uses: ./visual-diff-github-action/actions/stage-visual-artifacts
        with:
          artifact-type: diff
          bundle-dir: qa-artifacts/visual-diff-artifact
          summary-json-path: ${{ steps.compare.outputs.summary-path }}
          summary-markdown-path: ${{ steps.compare.outputs.markdown-path }}
          baseline-results-path: ${{ steps.baseline.outputs.results-file }}
          current-results-path: ${{ steps.capture.outputs.results-file }}
          baseline-manifest-path: ${{ steps.baseline.outputs.manifest-file }}
          current-manifest-path: ${{ steps.capture.outputs.manifest-file }}
          baseline-screenshots-dir: ${{ steps.baseline.outputs.screenshots-dir }}
          current-screenshots-dir: ${{ steps.capture.outputs.screenshots-root }}/screenshots

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-visual-diff-${{ github.run_id }}
          retention-days: ${{ inputs.artifact-retention-days }}
          path: ${{ steps.stage.outputs.bundle-dir }}

      - name: Publish PR comment
        if: ${{ inputs.comment-on-pr && inputs.pr-number != '' }}
        uses: ./visual-diff-github-action/actions/publish-visual-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr-number }}
          summary-path: ${{ steps.compare.outputs.summary-path }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          artifact-name: pr-visual-diff-${{ github.run_id }}

      - name: Evaluate outcome
        uses: ./visual-diff-github-action/actions/evaluate-visual-diff-outcome
        with:
          summary-path: ${{ steps.compare.outputs.summary-path }}
