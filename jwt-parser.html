<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Parser & Validator</title>
    <style>
        .jwt-wrapper {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .jwt-parser {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            font-family: Arial, sans-serif;
        }

        .jwt-parser h1,
        .jwt-parser h2 {
            color: #333;
        }

        .jwt-parser .form-group {
            margin-bottom: 15px;
        }

        .jwt-parser label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .jwt-parser textarea,
        .jwt-parser input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .jwt-parser button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .jwt-parser button:hover {
            background-color: #218838;
        }

        .jwt-parser pre {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;       /* Since CSS3 */
            white-space: -moz-pre-wrap;  /* Mozilla, since 1999 */
            white-space: -pre-wrap;      /* Opera 4-6 */
            white-space: -o-pre-wrap;    /* Opera 7 */
            word-wrap: break-word;       /* Internet Explorer 5.5+ */
        }

        .jwt-parser #jwtSignatureStatus {
            font-weight: bold;
        }
    </style>
</head>
<body class="jwt-wrapper">
    <div class="jwt-parser">
        <h1>JWT Parser &amp; Validator</h1>

        <div class="form-group">
            <label for="jwtInputToken">Enter JWT Token:</label>
            <textarea id="jwtInputToken" rows="4" placeholder="Paste your JWT here..."></textarea>
        </div>

        <div class="form-group">
            <label for="jwtSecretKey">Enter Secret:</label>
            <input type="text" id="jwtSecretKey" placeholder="Secret used to sign the token...">
        </div>

        <button onclick="parseJWT()">Parse &amp; Validate JWT</button>

        <h2>Decoded Token:</h2>
        <pre id="jwtDecodedOutput"></pre>

        <h2>Validation Result:</h2>
        <p id="jwtSignatureStatus"></p>
    </div>

    <script>
        async function parseJWT() {
            const jwt = document.getElementById('jwtInputToken').value;
            const secret = document.getElementById('jwtSecretKey').value;

            if (!jwt) {
                alert("Please enter a JWT token.");
                return;
            }

            try {
                // Decode the JWT
                const parts = jwt.split('.');
                const header = JSON.parse(atob(parts[0]));
                const payload = JSON.parse(atob(parts[1]));

                document.getElementById('jwtDecodedOutput').textContent = `Header: ${JSON.stringify(header, null, 2)}\nPayload: ${JSON.stringify(payload, null, 2)}`;

                // Validate the signature
                const isValidSignature = await validateJWT(jwt, secret);
                document.getElementById('jwtSignatureStatus').textContent = `Signature is ${isValidSignature ? 'valid' : 'invalid'}!`;

            } catch (e) {
                document.getElementById('jwtDecodedOutput').textContent = "Invalid JWT format.";
                document.getElementById('jwtSignatureStatus').textContent = "Error validating signature";
                console.error(e);
            }
        }

        async function validateJWT(token, secret) {
            const base64UrlDecode = (str) => {
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                return atob(str);
            };

            const base64UrlEncode = (str) => {
                return btoa(str)
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');
            };
            try {
                const parts = token.split('.');
                const header = base64UrlDecode(parts[0]);
                const payload = base64UrlDecode(parts[1]);
                const providedSignature = parts[2];

                const signatureInput = parts[0] + '.' + parts[1];
                const signature = await hmacSha256(signatureInput, secret);
                const recreatedSignature = base64UrlEncode(String.fromCharCode(...new Uint8Array(signature)));
                
                return recreatedSignature === providedSignature;
            } catch (e) {
                console.error('Error validating JWT:', e);
                return false;
            }
        }

        // Implementation of HMAC-SHA256
        async function hmacSha256(message, key) {
            const encoder = new TextEncoder();
            const messageBuffer = encoder.encode(message);
            const keyBuffer = encoder.encode(key);

            const cryptoKey = await crypto.subtle.importKey(
                "raw",
                keyBuffer,
                { name: "HMAC", hash: { name: "SHA-256" } },
                false,
                ["sign"]
            );

            const signature = await crypto.subtle.sign(
                "HMAC",
                cryptoKey,
                messageBuffer
            );

            return new Uint8Array(signature);
        }

    </script>
</body>
</html>
