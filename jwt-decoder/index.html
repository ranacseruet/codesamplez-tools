<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JWT Decoder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="jwt-builder-container">
    <h1 class="jwt-builder-header">JWT Decoder & Validator</h1>
    <form id="jwtForm">
      <div class="claims-group">
        <h3 class="group-header">JWT Token</h3>
        <div class="claim-row">
          <label for="jwtInputToken" class="required" title="The JWT token to decode and validate">
            Token:
            <span class="tooltip">Required - Paste your JWT token here for decoding and validation</span>
          </label>
          <textarea id="jwtInputToken" class="jwt-builder-input" rows="4" placeholder="Paste your JWT here..."></textarea>
        </div>
      </div>

      <div class="claims-group">
        <h3 class="group-header">Signature Verification</h3>
        <div class="claim-row">
          <label for="jwtSecretKey" title="Secret key used to verify the JWT signature">
            Secret Key:
            <span class="tooltip">Optional - Enter the secret key to verify the JWT signature</span>
          </label>
          <input type="text" id="jwtSecretKey" class="jwt-builder-input" placeholder="Secret used to sign the token...">
        </div>
      </div>

      <div class="claims-group result-section">
        <h3 class="group-header">Decoded Token</h3>
        <div class="result-container">
          <div id="jwtDecodedOutput" class="jwt-builder-output"></div>
          <button type="button" id="copyDecodedBtn" class="jwt-builder-button copy-button" onclick="copyDecoded()" title="Copy decoded token">
            Copy Decoded
          </button>
        </div>
      </div>

      <div class="claims-group result-section">
        <h3 class="group-header">Validation Result</h3>
        <div id="jwtSignatureStatus" class="jwt-builder-output"></div>
      </div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
