name: PR Visual Diff

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  visual-diff:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          set -euo pipefail
          npm start > /tmp/visual-pr-diff-start.log 2>&1 &
          echo "QA_SERVER_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for i in $(seq 1 45); do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/visual-pr-diff-start.log || true
            exit 1
          fi

      - name: Run visual PR diff
        id: visual_diff
        uses: ./visual-diff-github-action/actions/run-visual-pr-diff
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-config-path: .github/visual-regression.json
          force-run: ${{ github.event_name == 'workflow_dispatch' }}
          force-run-reason: manual_dispatch

      - name: Stop app
        if: always()
        run: kill "$QA_SERVER_PID" || true
