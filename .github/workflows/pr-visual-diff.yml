# Manual force-run only. The automatic per-PR visual diff is a gated job in
# ci.yml (runs after test-and-build passes). This workflow stays for the
# on-demand `workflow_dispatch` path — e.g. re-running a diff against the
# current ref without pushing a new commit.
name: PR Visual Diff (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

# Manual runs share one Snap API key. Two dispatches that started together
# (runs 40358989457 and 40359049703) received HTTP 429 on capture upload.
# Queue the next run instead of overlapping a capture that is already going.
concurrency:
  group: pr-visual-diff-manual-${{ github.repository }}
  cancel-in-progress: false

jobs:
  visual-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        # Local asset origin so the served build loads its own CSS/JS instead of
        # the production CDN (see ci.yml visual-diff for the full rationale).
        # Trackers disabled so manual diff runs match the CI baseline capture.
        run: npm run build
        env:
          CST_SITE_STATIC_ROOT_URI: http://127.0.0.1:8080
          CST_DISABLE_ANALYTICS: '1'

      - name: Start app
        run: |
          set -euo pipefail
          npm start > /tmp/visual-pr-diff-start.log 2>&1 &
          echo "QA_SERVER_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for i in $(seq 1 45); do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/visual-pr-diff-start.log || true
            exit 1
          fi

      - name: Run visual PR diff
        id: visual_diff
        uses: ranacseruet/snapdrift/actions/pr-diff@8e827952c33415ba2d8f1fdab944d519534013a6 # v0.16.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-run: true
        env:
          SNAP_API_KEY: ${{ secrets.SNAP_API_KEY }}
          # The pinned action does not retry HTTP 429. This preload retries
          # /v1/visual/ 429s before that action treats them as a final failure.
          # The pull-request job in ci.yml does not set this.
          NODE_OPTIONS: "--require ${{ github.workspace }}/scripts/retry-snap-429.js"

      # Same completion gate as ci.yml. publish-baseline does not upload
      # ui-foundation-visual-baseline (the pinned baseline action only uploads
      # that GitHub artifact for the local provider). A missing lookup is
      # expected. Provider snap still compares the hosted baseline, and this
      # step fails only when that comparison did not finish. It does not fail
      # the job on the artifact lookup by itself.
      - name: Require a completed baseline comparison
        if: always() && steps.visual_diff.outcome != 'skipped'
        env:
          SHOULD_RUN: ${{ steps.visual_diff.outputs.should-run }}
          SCOPE_REASON: ${{ steps.visual_diff.outputs.scope-reason }}
          STATUS: ${{ steps.visual_diff.outputs.status }}
          SUMMARY_PATH: ${{ steps.visual_diff.outputs.summary-path }}
          BASELINE_FOUND: ${{ steps.visual_diff.outputs.baseline-found }}
          BASELINE_RESOLUTION_STATUS: ${{ steps.visual_diff.outputs.baseline-resolution-status }}
        run: node scripts/require-visual-comparison.js

      - name: Stop app
        if: always()
        run: kill "$QA_SERVER_PID" || true
