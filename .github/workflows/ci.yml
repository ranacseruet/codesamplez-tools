name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # `ready_for_review` is required so the draft-gated `visual-diff` job runs
    # when a draft PR is marked ready — without it CI only fires on
    # opened/synchronize/reopened and the diff would be missing until the next
    # push (it used to live in pr-visual-diff.yml, which listed this type).
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# Cancel superseded PR runs (stale commits), but never cancel main runs: on push
# the group key is unique per run (run_id), so concurrent main builds proceed
# independently. Deploy serialization is handled separately on the deploy job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test -- --coverage

    - name: Dependency Audit
      run: npm run audit:deps

    - name: Detect affected runtime targets
      id: affected
      run: |
        node scripts/detect-affected-tools.js \
          --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" \
          --head "${{ github.sha }}" \
          --write-github-output

    - name: Build
      if: steps.affected.outputs.should_build == 'true'
      run: |
        set -euo pipefail
        rm -rf build
        BUILD_ARGS=()
        if [ -n "${{ steps.affected.outputs.affected_tools }}" ]; then
          BUILD_ARGS+=(--tools "${{ steps.affected.outputs.affected_tools }}")
        fi
        if [ "${{ steps.affected.outputs.include_root_shell }}" = "true" ]; then
          BUILD_ARGS+=(--include-root-shell)
        fi
        if [ "${{ steps.affected.outputs.include_root_assets }}" = "true" ]; then
          BUILD_ARGS+=(--include-root-assets)
        fi
        NODE_ENV=production npm run build -- "${BUILD_ARGS[@]}"

    - name: Cache build artifacts
      if: steps.affected.outputs.should_build == 'true'
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Verify Build Artifacts
      if: steps.affected.outputs.should_build == 'true'
      run: |
        set -euo pipefail
        VERIFY_ARGS=()
        if [ -n "${{ steps.affected.outputs.affected_tools }}" ]; then
          VERIFY_ARGS+=(--tools "${{ steps.affected.outputs.affected_tools }}")
        fi
        if [ "${{ steps.affected.outputs.include_root_shell }}" = "true" ]; then
          VERIFY_ARGS+=(--include-root-shell)
        fi
        npm run verify-build -- "${VERIFY_ARGS[@]}"

    - name: Bundle Metrics Report
      if: steps.affected.outputs.should_build == 'true'
      run: |
        set -euo pipefail
        METRIC_ARGS=()
        if [ -n "${{ steps.affected.outputs.affected_tools }}" ]; then
          METRIC_ARGS+=(--tools "${{ steps.affected.outputs.affected_tools }}")
        fi
        if [ "${{ steps.affected.outputs.include_root_shell }}" = "true" ]; then
          METRIC_ARGS+=(--include-root-shell)
        fi
        npm run bundle-metrics -- "${METRIC_ARGS[@]}"

    - name: Bundle Budget Check
      if: steps.affected.outputs.affected_tool_count != '0'
      run: npm run bundle-budget-check -- --tools "${{ steps.affected.outputs.affected_tools }}"

    - name: Start Local Server for QA Baselines
      if: github.ref == 'refs/heads/main' && steps.affected.outputs.affected_tool_count != '0'
      run: |
        set -euo pipefail
        npm start > /tmp/codesamplez-ci-start.log 2>&1 &
        echo "QA_SERVER_PID=$!" >> $GITHUB_ENV
        ready=0
        for i in $(seq 1 45); do
          if curl -sSf http://127.0.0.1:8080 >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "QA server failed to start on http://127.0.0.1:8080"
          cat /tmp/codesamplez-ci-start.log || true
          exit 1
        fi

    - name: Accessibility Baseline (report-only)
      if: github.ref == 'refs/heads/main' && steps.affected.outputs.affected_tool_count != '0'
      run: npm run qa:a11y:foundation -- --tools "${{ steps.affected.outputs.affected_tools }}"
      env:
        QA_BASE_URL: http://127.0.0.1:8080
        QA_A11Y_FAIL_ON_VIOLATIONS: '0'
      continue-on-error: true

    - name: Publish main visual baseline
      if: github.ref == 'refs/heads/main' && steps.affected.outputs.scope == 'all-tools'
      uses: ranacseruet/snapdrift/actions/baseline@main
      with:
        upload-artifact: 'false'
      env:
        SNAP_API_KEY: ${{ secrets.SNAP_API_KEY }}

    - name: Stop Local QA Server
      if: always() && github.ref == 'refs/heads/main' && steps.affected.outputs.affected_tool_count != '0'
      run: kill $QA_SERVER_PID || true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Serialize production deploys. Affected-target detection diffs against the
    # immediate predecessor (github.event.before), so back-to-back merges must
    # deploy one-at-a-time — never cancelled — or a commit's changes would be
    # skipped. Queuing (cancel-in-progress: false) also removes the CloudFront
    # publish-function ETag race between concurrent deploys.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect affected deploy targets
      id: affected
      run: |
        node scripts/detect-affected-tools.js \
          --base "${{ github.event.before }}" \
          --head "${{ github.sha }}" \
          --write-github-output

    - name: Detect CloudFront Function changes
      id: cloudfront_function
      run: |
        set -euo pipefail
        BASE="${{ github.event.before }}"
        HEAD="${{ github.sha }}"
        if [[ "$BASE" =~ ^0+$ ]]; then
          BASE="$(git rev-parse "$HEAD^")"
        fi
        if git diff --name-only "$BASE" "$HEAD" | grep -E '^(infrastructure/cloudfront-functions/RewriteStaticURLs\.js|scripts/deploy-cloudfront-function\.js|package\.json|package-lock\.json|\.github/workflows/ci\.yml)$' >/dev/null; then
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore build artifacts
      if: steps.affected.outputs.should_deploy == 'true'
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Configure AWS credentials
      if: steps.affected.outputs.should_deploy == 'true' || steps.cloudfront_function.outputs.should_deploy == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy CloudFront Function
      if: steps.cloudfront_function.outputs.should_deploy == 'true'
      run: |
        npm run deploy:cloudfront-function -- --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"

    - name: Deploy affected assets
      if: steps.affected.outputs.should_deploy == 'true'
      run: |
        set -euo pipefail
        DEPLOY_ARGS=(--bucket tools.codesamplez.com --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}")
        if [ -n "${{ steps.affected.outputs.affected_tools }}" ]; then
          DEPLOY_ARGS+=(--tools "${{ steps.affected.outputs.affected_tools }}")
        fi
        if [ "${{ steps.affected.outputs.include_root_shell }}" = "true" ]; then
          DEPLOY_ARGS+=(--include-root-shell)
        fi
        if [ "${{ steps.affected.outputs.include_root_assets }}" = "true" ]; then
          DEPLOY_ARGS+=(--include-root-assets)
        fi
        npm run deploy:affected -- "${DEPLOY_ARGS[@]}"

  # Gated on test-and-build: the visual diff is the most expensive job (Chrome
  # screenshotting, 45-min timeout) and posts a PR comment, so there's no point
  # running it on a PR that doesn't pass typecheck/tests/audit/budget/build.
  # PR-only; the manual force-run path lives in pr-visual-diff.yml. On push to
  # main the baseline is published inside test-and-build instead.
  # Same-repo PRs only: forked-repo and Dependabot PRs don't receive repository
  # secrets (GitHub passes only GITHUB_TOKEN), so SNAP_API_KEY would be empty and
  # snapdrift's Snap provider throws at config load. Skip the job rather than fail
  # CI after the gates for contributions that can't reach the hosted backend.
  visual-diff:
    needs: test-and-build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          set -euo pipefail
          npm start > /tmp/visual-pr-diff-start.log 2>&1 &
          echo "QA_SERVER_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for i in $(seq 1 45); do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/visual-pr-diff-start.log || true
            exit 1
          fi

      - name: Run visual PR diff
        id: visual_diff
        uses: ranacseruet/snapdrift/actions/pr-diff@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SNAP_API_KEY: ${{ secrets.SNAP_API_KEY }}

      - name: Stop app
        if: always()
        run: kill "$QA_SERVER_PID" || true
