name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Detect visual QA relevance
      id: visual_relevance
      uses: actions/github-script@v7
      with:
        script: |
          const allToolPrefixes = [
            'data-format-converter/',
            'js-minifier-tool/',
            'base64-converter-tool/',
            'jwt-builder-tool/',
            'jwt-decoder-tool/',
            'json-formatter-tool/',
            'css-minifier-tool/',
            'text-analyzer-tool/',
            'qr-code-generator/',
            'diff-checker-tool/'
          ];
          const sharedPrefixes = ['common/'];
          const sharedExact = new Set([
            'index.html',
            'styles.css',
            'root-shell.ts',
            'webpack.config.js',
            'package.json',
            'package-lock.json',
            'babel.config.js',
            'docs/ui-styling-conventions.md',
            'docs/ui-component-catalog.html',
            'docs/ui-component-catalog.css',
            'scripts/visual-baseline-ui-foundation.mjs',
            'scripts/visual-diff-ui-foundation.mjs',
            'scripts/a11y-baseline-ui-foundation.mjs'
          ]);

          if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
            core.setOutput('run_visual_qa', 'true');
            core.setOutput('reason', 'main_push');
            return;
          }

          if (context.eventName !== 'pull_request' || !context.payload.pull_request?.number) {
            core.setOutput('run_visual_qa', 'true');
            core.setOutput('reason', 'non_pr_event');
            return;
          }

          try {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const filenames = files.map((file) => file.filename);
            const hasVisualRelevantChanges = filenames.some((file) => (
              sharedPrefixes.some((prefix) => file.startsWith(prefix)) ||
              allToolPrefixes.some((prefix) => file.startsWith(prefix)) ||
              sharedExact.has(file) ||
              /^public-path\./.test(file)
            ));

            core.setOutput('run_visual_qa', hasVisualRelevantChanges ? 'true' : 'false');
            core.setOutput('reason', hasVisualRelevantChanges ? 'visual_relevant_changes' : 'no_visual_relevant_changes');
          } catch (error) {
            core.warning(`Unable to inspect PR files for visual QA relevance; defaulting to run visual QA. ${error.message}`);
            core.setOutput('run_visual_qa', 'true');
            core.setOutput('reason', 'visual_relevance_check_failed');
          }

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test -- --coverage

    - name: Build
      run: rm -rf build && NODE_ENV=production && npm run build

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Verify Build Artifacts
      run: npm run verify-build

    - name: Bundle Metrics Report
      run: npm run bundle-metrics

    - name: Bundle Budget Check
      run: npm run bundle-budget-check

    - name: Install Playwright Chromium
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: npx playwright install --with-deps chromium

    - name: Start Local Server for QA Baselines
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: |
        set -euo pipefail
        npm start > /tmp/codesamplez-ci-start.log 2>&1 &
        echo "QA_SERVER_PID=$!" >> $GITHUB_ENV
        ready=0
        for i in $(seq 1 45); do
          if curl -sSf http://127.0.0.1:8080 >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "QA server failed to start on http://127.0.0.1:8080"
          cat /tmp/codesamplez-ci-start.log || true
          exit 1
        fi

    - name: Accessibility Baseline (report-only)
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: npm run qa:a11y:foundation
      env:
        QA_BASE_URL: http://127.0.0.1:8080
        QA_A11Y_FAIL_ON_VIOLATIONS: '0'
      continue-on-error: true

    - name: Visual Baseline Snapshot Capture (report-only)
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: npm run qa:visual-baseline:foundation
      env:
        QA_BASE_URL: http://127.0.0.1:8080
        QA_VISUAL_OUT_DIR: qa-artifacts/visual-baselines/ui-foundation
        QA_VISUAL_RESULTS_FILE: qa-artifacts/visual-baselines/ui-foundation/visual-baseline-results.json
      continue-on-error: true

    - name: Record skipped visual QA summary
      if: steps.visual_relevance.outputs.run_visual_qa != 'true'
      run: |
        cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
        ## Visual QA

        - Status: skipped
        - Reason: no visual-relevant changes detected in this pull request
        EOF

    - name: Prepare main visual baseline artifact bundle
      if: github.ref == 'refs/heads/main' && always()
      run: |
        set -euo pipefail
        BUNDLE_DIR="qa-artifacts/visual-baseline-artifact"
        rm -rf "$BUNDLE_DIR"
        mkdir -p "$BUNDLE_DIR/screenshots"
        if [ -f qa-artifacts/visual-baselines/ui-foundation/visual-baseline-results.json ]; then
          cp qa-artifacts/visual-baselines/ui-foundation/visual-baseline-results.json "$BUNDLE_DIR/visual-baseline-results.json"
        fi
        find qa-artifacts/visual-baselines/ui-foundation -type f -name '*.png' -exec cp {} "$BUNDLE_DIR/screenshots/" \;

    - name: Upload main visual baseline artifacts
      if: github.ref == 'refs/heads/main' && always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-foundation-visual-baseline
        retention-days: 30
        if-no-files-found: warn
        path: |
          qa-artifacts/visual-baseline-artifact

    - name: Stop Local QA Server
      if: always() && steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: kill $QA_SERVER_PID || true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Restore build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://tools.codesamplez.com/ \
          --exclude "*" \
          --include "*.js" \
          --include "*.css" \
          --include "robots.txt" \
          --delete
    - name: Invalidate CloudFront cache
      run: |    
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
