name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Load visual regression config
      id: visual_config
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const configPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'visual-regression.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

          core.setOutput('baseline_artifact_name', config.baselineArtifactName);
          core.setOutput('results_file', config.resultsFile);
          core.setOutput('manifest_file', config.manifestFile);
          core.setOutput('screenshots_root', config.screenshotsRoot);
          core.setOutput('screenshots_dir', `${config.screenshotsRoot}/screenshots`);
          core.setOutput('all_route_ids', (config.routes || []).map((route) => route.id).join(','));

    - name: Detect visual QA relevance
      id: visual_relevance
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const configPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'visual-regression.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const allRouteIds = `${{ steps.visual_config.outputs.all_route_ids }}`.split(',').filter(Boolean);
          const sharedPrefixes = config.selection?.sharedPrefixes || [];
          const sharedExact = new Set(config.selection?.sharedExact || []);
          const routes = Array.isArray(config.routes) ? config.routes : [];

          if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
            core.setOutput('run_visual_qa', 'true');
            core.setOutput('reason', 'main_push');
            core.setOutput('selected_route_ids', allRouteIds.join(','));
            return;
          }

          if (context.eventName !== 'pull_request' || !context.payload.pull_request?.number) {
            core.setOutput('run_visual_qa', 'true');
            core.setOutput('reason', 'non_pr_event');
            core.setOutput('selected_route_ids', allRouteIds.join(','));
            return;
          }

          try {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const filenames = files.map((file) => file.filename);
            if (filenames.some((file) => sharedExact.has(file) || sharedPrefixes.some((prefix) => file.startsWith(prefix)))) {
              core.setOutput('run_visual_qa', 'true');
              core.setOutput('reason', 'shared_visual_change');
              core.setOutput('selected_route_ids', allRouteIds.join(','));
              return;
            }

            const selectedRouteIds = routes
              .filter((route) => (route.changePaths || []).some((prefix) => filenames.some((file) => file.startsWith(prefix))))
              .map((route) => route.id);

            core.setOutput('run_visual_qa', selectedRouteIds.length > 0 ? 'true' : 'false');
            core.setOutput('reason', selectedRouteIds.length > 0 ? 'scoped_visual_change' : 'no_visual_relevant_changes');
            core.setOutput('selected_route_ids', selectedRouteIds.join(','));
          } catch (error) {
            core.warning(`Unable to inspect PR files for visual QA relevance; defaulting to run visual QA. ${error.message}`);
            core.setOutput('run_visual_qa', 'true');
            core.setOutput('reason', 'visual_relevance_check_failed');
            core.setOutput('selected_route_ids', allRouteIds.join(','));
          }

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test -- --coverage

    - name: Build
      run: rm -rf build && NODE_ENV=production && npm run build

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Verify Build Artifacts
      run: npm run verify-build

    - name: Bundle Metrics Report
      run: npm run bundle-metrics

    - name: Bundle Budget Check
      run: npm run bundle-budget-check

    - name: Install Playwright Chromium
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: npx playwright install --with-deps chromium

    - name: Start Local Server for QA Baselines
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: |
        set -euo pipefail
        npm start > /tmp/codesamplez-ci-start.log 2>&1 &
        echo "QA_SERVER_PID=$!" >> $GITHUB_ENV
        ready=0
        for i in $(seq 1 45); do
          if curl -sSf http://127.0.0.1:8080 >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "QA server failed to start on http://127.0.0.1:8080"
          cat /tmp/codesamplez-ci-start.log || true
          exit 1
        fi

    - name: Accessibility Baseline (report-only)
      if: steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: npm run qa:a11y:foundation
      env:
        QA_BASE_URL: http://127.0.0.1:8080
        QA_A11Y_FAIL_ON_VIOLATIONS: '0'
      continue-on-error: true

    - name: Capture baseline visual routes
      if: github.ref == 'refs/heads/main' && steps.visual_relevance.outputs.run_visual_qa == 'true'
      id: capture_visual
      uses: ./visual-diff-github-action/actions/capture-visual-routes
      with:
        repo-config-path: .github/visual-regression.json
        route-ids: ${{ steps.visual_relevance.outputs.selected_route_ids }}

    - name: Stage main visual baseline artifact
      if: github.ref == 'refs/heads/main' && steps.visual_relevance.outputs.run_visual_qa == 'true'
      id: stage_visual
      uses: ./visual-diff-github-action/actions/stage-visual-artifacts
      with:
        artifact-type: baseline
        bundle-dir: qa-artifacts/visual-baseline-artifact
        results-path: ${{ steps.capture_visual.outputs.results-file }}
        manifest-path: ${{ steps.capture_visual.outputs.manifest-file }}
        screenshots-dir: ${{ steps.capture_visual.outputs.screenshots-root }}/screenshots

    - name: Upload main visual baseline artifacts
      if: github.ref == 'refs/heads/main' && steps.visual_relevance.outputs.run_visual_qa == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.visual_config.outputs.baseline_artifact_name }}
        retention-days: 30
        if-no-files-found: warn
        path: ${{ steps.stage_visual.outputs.bundle-dir }}

    - name: Record skipped visual QA summary
      if: steps.visual_relevance.outputs.run_visual_qa != 'true'
      run: |
        cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
        ## Visual QA

        - Status: skipped
        - Reason: no visual-relevant changes detected in this pull request
        EOF

    - name: Stop Local QA Server
      if: always() && steps.visual_relevance.outputs.run_visual_qa == 'true'
      run: kill $QA_SERVER_PID || true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Restore build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://tools.codesamplez.com/ \
          --exclude "*" \
          --include "*.js" \
          --include "*.css" \
          --include "robots.txt" \
          --delete
    - name: Invalidate CloudFront cache
      run: |    
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
