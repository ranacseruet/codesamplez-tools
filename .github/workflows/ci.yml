name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test -- --coverage

    - name: Build
      run: rm -rf build && NODE_ENV=production && npm run build

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Verify Build Artifacts
      run: npm run verify-build

    - name: Bundle Metrics Report
      run: npm run bundle-metrics

    - name: Bundle Budget Check
      run: npm run bundle-budget-check

    - name: Start Local Server for QA Baselines
      if: github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        npm start > /tmp/codesamplez-ci-start.log 2>&1 &
        echo "QA_SERVER_PID=$!" >> $GITHUB_ENV
        ready=0
        for i in $(seq 1 45); do
          if curl -sSf http://127.0.0.1:8080 >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "QA server failed to start on http://127.0.0.1:8080"
          cat /tmp/codesamplez-ci-start.log || true
          exit 1
        fi

    - name: Accessibility Baseline (report-only)
      if: github.ref == 'refs/heads/main'
      run: npm run qa:a11y:foundation
      env:
        QA_BASE_URL: http://127.0.0.1:8080
        QA_A11Y_FAIL_ON_VIOLATIONS: '0'
      continue-on-error: true

    - name: Publish main visual baseline
      if: github.ref == 'refs/heads/main'
      uses: ranacseruet/snapdrift/actions/baseline@v0.1.0

    - name: Stop Local QA Server
      if: always() && github.ref == 'refs/heads/main'
      run: kill $QA_SERVER_PID || true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Restore build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://tools.codesamplez.com/ \
          --exclude "*" \
          --include "*.js" \
          --include "*.css" \
          --include "robots.txt" \
          --delete
    - name: Invalidate CloudFront cache
      run: |    
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
