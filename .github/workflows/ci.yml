name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Load visual regression config
      id: visual_config
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const configPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'visual-regression.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

          core.setOutput('baseline_artifact_name', config.baselineArtifactName);

    - name: Determine visual QA scope
      id: visual_relevance
      uses: ./visual-diff-github-action/actions/determine-visual-diff-scope
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repo-config-path: .github/visual-regression.json
        pr-number: ${{ github.event.pull_request.number || '' }}
        force-run: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        force-run-reason: main_push

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test -- --coverage

    - name: Build
      run: rm -rf build && NODE_ENV=production && npm run build

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Verify Build Artifacts
      run: npm run verify-build

    - name: Bundle Metrics Report
      run: npm run bundle-metrics

    - name: Bundle Budget Check
      run: npm run bundle-budget-check

    - name: Install Playwright Chromium
      if: steps.visual_relevance.outputs.should-run == 'true'
      run: npx playwright install --with-deps chromium

    - name: Start Local Server for QA Baselines
      if: steps.visual_relevance.outputs.should-run == 'true'
      run: |
        set -euo pipefail
        npm start > /tmp/codesamplez-ci-start.log 2>&1 &
        echo "QA_SERVER_PID=$!" >> $GITHUB_ENV
        ready=0
        for i in $(seq 1 45); do
          if curl -sSf http://127.0.0.1:8080 >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "QA server failed to start on http://127.0.0.1:8080"
          cat /tmp/codesamplez-ci-start.log || true
          exit 1
        fi

    - name: Accessibility Baseline (report-only)
      if: steps.visual_relevance.outputs.should-run == 'true'
      run: npm run qa:a11y:foundation
      env:
        QA_BASE_URL: http://127.0.0.1:8080
        QA_A11Y_FAIL_ON_VIOLATIONS: '0'
      continue-on-error: true

    - name: Capture baseline visual routes
      if: github.ref == 'refs/heads/main' && steps.visual_relevance.outputs.should-run == 'true'
      id: capture_visual
      uses: ./visual-diff-github-action/actions/capture-visual-routes
      with:
        repo-config-path: .github/visual-regression.json
        route-ids: ${{ steps.visual_relevance.outputs.selected-route-ids }}

    - name: Stage main visual baseline artifact
      if: github.ref == 'refs/heads/main' && steps.visual_relevance.outputs.should-run == 'true'
      id: stage_visual
      uses: ./visual-diff-github-action/actions/stage-visual-artifacts
      with:
        artifact-type: baseline
        bundle-dir: qa-artifacts/visual-baseline-artifact
        results-path: ${{ steps.capture_visual.outputs.results-file }}
        manifest-path: ${{ steps.capture_visual.outputs.manifest-file }}
        screenshots-dir: ${{ steps.capture_visual.outputs.screenshots-root }}/screenshots

    - name: Upload main visual baseline artifacts
      if: github.ref == 'refs/heads/main' && steps.visual_relevance.outputs.should-run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.visual_config.outputs.baseline_artifact_name }}
        retention-days: 30
        if-no-files-found: warn
        path: ${{ steps.stage_visual.outputs.bundle-dir }}

    - name: Record skipped visual QA summary
      if: steps.visual_relevance.outputs.should-run != 'true'
      run: |
        cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
        ## Visual QA

        - Status: skipped
        - Reason: no visual-relevant changes detected in this pull request
        EOF

    - name: Stop Local QA Server
      if: always() && steps.visual_relevance.outputs.should-run == 'true'
      run: kill $QA_SERVER_PID || true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Restore build artifacts
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://tools.codesamplez.com/ \
          --exclude "*" \
          --include "*.js" \
          --include "*.css" \
          --include "robots.txt" \
          --delete
    - name: Invalidate CloudFront cache
      run: |    
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
