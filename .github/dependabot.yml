version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    # Only names that exist as repo labels. Dependabot silently drops unknown
    # names, which is why `dependencies` and `security` never stuck and those
    # PRs failed the version-bump gate unlabeled. Manifest-only npm updates
    # cannot bump per-tool versions; the checker also skips them when the
    # author is dependabot[bot] (see scripts/check-version-bumps.js).
    labels:
      - skip-version-bump
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
    groups:
      preact:
        patterns:
          - "preact"
          - "preact-*"
      babel:
        patterns:
          - "@babel/*"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@types/jest"
          - "jsdom"
      types:
        patterns:
          - "@types/*"
      webpack:
        patterns:
          - "webpack"
          - "webpack-*"
      playwright:
        patterns:
          - "playwright"
          - "*playwright*"
      css:
        patterns:
          - "cssnano"
          - "css-*"
          - "postcss*"
