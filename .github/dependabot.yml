version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    # No labels. Do not list skip-version-bump here. CI exits on that label
    # before it checks the author and the changed files, so an automatic
    # label would also skip a later commit that edits a tool file. Manifest-only
    # npm updates are skipped by the dependabot[bot] author check in
    # scripts/check-version-bumps.js, and only when every path is package.json
    # or package-lock.json.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
    groups:
      preact:
        patterns:
          - "preact"
          - "preact-*"
      babel:
        patterns:
          - "@babel/*"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@types/jest"
          - "jsdom"
      types:
        patterns:
          - "@types/*"
      webpack:
        patterns:
          - "webpack"
          - "webpack-*"
      playwright:
        patterns:
          - "playwright"
          - "*playwright*"
      css:
        patterns:
          - "cssnano"
          - "css-*"
          - "postcss*"
