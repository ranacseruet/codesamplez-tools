version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
    groups:
      preact:
        patterns:
          - "preact"
          - "preact-*"
      babel:
        patterns:
          - "@babel/*"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@types/jest"
      types:
        patterns:
          - "@types/*"
      webpack:
        patterns:
          - "webpack"
          - "webpack-*"
