<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
</head>
<body>
    <div class="jsonf-container">
        <div class="jsonf-header">
            <h1 class="jsonf-title">JSON Formatter</h1>
            <p class="jsonf-description">Format, validate, and beautify your JSON with this easy-to-use tool</p>
        </div>

        <div class="jsonf-editor-container">
            <div class="jsonf-panel">
                <h2>Input JSON</h2>
                <textarea class="jsonf-input" placeholder="Paste your JSON here..."></textarea>
            </div>

            <div class="jsonf-panel">
                <h2>Formatted Output</h2>
                <div class="jsonf-output-container">
                    <pre class="jsonf-output"><code class="language-json"></code></pre>
                </div>
            </div>
        </div>

        <div class="jsonf-controls">
            <button class="jsonf-button">Format JSON</button>
            <button class="jsonf-button jsonf-secondary" disabled>Copy Output</button>
            <button class="jsonf-button jsonf-sample">Load Sample</button>
        </div>

        <div class="jsonf-stats">
            <div class="jsonf-stat-row">
                <span>Original Size:</span>
                <span class="jsonf-original-size">0 bytes</span>
            </div>
            <div class="jsonf-stat-row">
                <span>Formatted Size:</span>
                <span class="jsonf-formatted-size">0 bytes</span>
            </div>
        </div>

        <div class="jsonf-error"></div>

        <div class="jsonf-footer">
            Made with ❤️ for developers
        </div>
    </div>

    <script src="bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
